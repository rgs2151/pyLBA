[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyLBA"
version = "0.1.0"
description = "A Python package for Linear Ballistic Accumulator and other accumulator models"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Rudramani Singha", email = "rgs2151@columbia.com"}
]
maintainers = [
    {name = "Rudramani Singha", email = "rgs2151@columbia.com"}
]
keywords = [
    "psychology",
    "neuroscience", 
    "cognitive modeling",
    "accumulator models",
    "LBA",
    "reaction time"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pymc>=5.0.0",
    "pytensor>=2.8.0",
    "arviz>=0.12.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = ["black", "jupyter", "build"]
docs = ["sphinx>=7,<9", "pydata-sphinx-theme>=0.16,<0.20"]

[project.urls]
Homepage = "https://github.com/rgs2151/pyLBA"
Documentation = "https://rgs2151.github.io/pyLBA/"
Repository = "https://github.com/rgs2151/pyLBA"
"Bug Reports" = "https://github.com/rgs2151/pyLBA/issues"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["pyLBA*"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
